name: MotoNav Android Build

on:
  push:
    branches: ["**"]
    paths:
      - "motonav/**"
      - ".github/workflows/motonav-android-build.yml"
  pull_request:
    paths:
      - "motonav/**"
      - ".github/workflows/motonav-android-build.yml"
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motonav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: motonav-debug-apk
          path: motonav/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
